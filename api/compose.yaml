services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fulbacho
      POSTGRES_USER: fulbacho
      POSTGRES_PASSWORD: fulbacho
    ports:
      - "5432:5432"
    volumes:
      - fulbacho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulbacho -d fulbacho"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fulbacho_pgdata:
